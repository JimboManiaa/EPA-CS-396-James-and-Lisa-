    <script>

    // JS BEGINS HERE ===============================================================
    // ==============================================================================
    
    let myChart = null;
    let currentDataset = null;
    let currentChartType = 'line';

    // Function for the auto populating scroll list ---
    function renderRows(data) {
        const tableBody = document.getElementById("scrollBody");
        tableBody.innerHTML = "";
        
        if (!data || data.length === 0) {
            tableBody.innerHTML = `<p>No matching records found.</p>`;
            return;
        }

        data.forEach((entry, index) => {
            const row = document.createElement("p");
            row.innerHTML = `${entry.name} (${entry.facility})`;

            // Select first item by default
            if (index === 0) {
                row.classList.add("active");
                selectDataset(entry);
            }

            // Make the list item clickable
            row.addEventListener("click", () => {
                const allItems = tableBody.querySelectorAll("p");
                allItems.forEach(item => item.classList.remove("active"));
                row.classList.add("active");
                selectDataset(entry);
            });

            tableBody.appendChild(row);
        });
    }

    // Unclick inactive datasets from list
    function setActiveChartButton(activeBtnId) {
        const buttons = document.querySelectorAll(".vis_cell");
        buttons.forEach(btn => btn.classList.remove("active"));
        const activeBtn = document.getElementById(activeBtnId);
        if (activeBtn) activeBtn.classList.add("active");
    }

    // Fetch datasets and bind chart buttons on page load
    document.addEventListener("DOMContentLoaded", () => {
        const chartButtons = [
            { id: 'lineChartBtn', type: 'line' },
            { id: 'barChartBtn', type: 'bar' },
            { id: 'histogramBtn', type: 'histogram' },
            { id: 'boxPlotBtn', type: 'boxplot' },
            { id: 'scatterPlotBtn', type: 'scatter' },
            { id: 'heatMapBtn', type: 'heatmap' }
        ];

        chartButtons.forEach(({ id, type }) => {
            const btn = document.getElementById(id);
            if (btn) {
                btn.addEventListener('click', () => {
                    currentChartType = type;
                    setActiveChartButton(id);
                    renderCurrentChart();
                });
            }
        });

        fetch('/api/datasets')
            .then(response => response.json())
            .then(data => {
                renderRows(data);
            })
            .catch(error => {
                console.error("Error loading datasets:", error);
                const tableBody = document.getElementById("scrollBody");
                tableBody.innerHTML = `<p>Failed to load datasets.</p>`;
            });
    });

    // Select dataset function --------------
    async function selectDataset(dataset) {
        // Change name on-load
        const titleElement = document.getElementById("selectedDatasetName");
        if (titleElement) {
            titleElement.textContent = dataset.name + " Dataset";
        }

        try {
            const response = await fetch(`/api/datasets/${dataset.id}`);
            if (!response.ok) throw new Error('Failed to fetch dataset records');
            
            currentDataset = await response.json();
            renderCurrentChart();
        } catch (error) {
            console.error("Error loading dataset records for chart:", error);
        }
    }

    // Function to render the charts with my.chart ---------------
    function renderCurrentChart() {
        if (!currentDataset || !currentDataset.records) return;

        if (myChart) {
            myChart.destroy();
        }

        // Map the Sequelize response to flatten the nested Unit and Facility data
        const records = currentDataset.records.map(rec => ({
            ...rec,
            facility: rec.Unit?.Facility?.facility_name || 'Unknown',
            state: rec.Unit?.Facility?.state || 'Unknown',
            epa_unit_id: rec.Unit?.epa_unit_id || 'Unknown',
            primary_fuel: rec.Unit?.primary_fuel || 'Unknown'
        }));

        if (records.length === 0) return;

        // Chart Types
        switch (currentChartType) {
            case 'line':
                renderLineChart(records);
                break;
            case 'bar':
                renderBarChart(records);
                break;
            case 'histogram':
                renderHistogram(records);
                break;
            case 'boxplot':
                renderBoxPlot(records);
                break;
            case 'scatter':
                renderScatterPlot(records);
                break;
            case 'heatmap':
                renderHeatMap(records);
                break;
        }
    }
    // Render line chart functionality -------------------------------
    function renderLineChart(records) {
        const ctx = document.getElementById('datasetChart').getContext('2d');

        const labels = records.map(r => r.reporting_year);
        const emissionsData = records.map(r => Number(r.co2_mass) || 0);
        const grossLoadData = records.map(r => Number(r.gross_load) || 0);

        // Calculate CO2 intensity
        const intensityData = records.map( r => {
            const co2 = Number(r.co2_mass) || 0;
            const load = Number(r.gross_load) || 0;
            return load > 0 ? Number((co2 / load).toFixed(4)) : null;




        });



        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        // red lines
                        label: 'CO2 Emissions (tons)',
                        data: emissionsData,
                        borderColor: '#989898',
                        backgroundColor: '#989898',
                        yAxisID: 'y',
                        tension: 0.1
                    },
                    {
                        // blue lines
                        label: 'Gross Load (MWh)',
                        data: grossLoadData,
                        borderColor: '#005FA3',
                        backgroundColor: '#005FA3',
                        yAxisID: 'y1',
                        tension: 0.1
                    },
                    {
                        label: "CO2 Intensity (tons/MWh)",
                        data: intensityData,
                        borderColor: '#97D3EA',
                        backgroundColor: '#97D3EA',
                        yAxisID: 'y2',
                        tension: 0.1,
                        spanGaps: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: { display: true, text: 'CO2 Emissions (tons)' }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: { display: true, text: 'Gross Load (MWh)' },
                        grid: { drawOnChartArea: false }
                    },
                    y2: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {display: true, text: 'IIntensity (tons/MWh)'},
                        grid: { drawOnChartArea: false }
                    }
                }
            }
        });
    }

    // 2. Render bar chart functionality -------------------------------

    // can compare states, fuels, facilities, units, or control technologies


    function renderBarChart(records) {
        const ctx = document.getElementById('datasetChart').getContext('2d');
        const groupFields = ['state', 'primary_fuel', 'facility', 'epa_unit_id'];
        const activeGroupField = groupFields.find(field => records.some(r => r[field] !== undefined && r[field] !== null)) || 'reporting_year';

        const aggregatedData = {};
        records.forEach(r => {
            const key = r[activeGroupField] || 'Unknown';
            aggregatedData[key] = (aggregatedData[key] || 0) + (Number(r.co2_mass) || 0);
        });

        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Object.keys(aggregatedData),
                datasets: [{
                    label: `Total CO2 Emissions by ${activeGroupField.replace('_', ' ').toUpperCase()}`,
                    data: Object.values(aggregatedData),
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgb(54, 162, 235)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'Total CO2 Mass (tons)' }
                    }
                }
            }
        });
    }





    // 3. Histogram (Distribution of CO2 Emissions)
    function renderHistogram(records) {
        const ctx = document.getElementById('datasetChart').getContext('2d');
        const values = records.map(r => Number(r.co2_mass)).filter(v => !isNaN(v) && v > 0);

        if (values.length === 0) return;

        const min = Math.min(...values);
        const max = Math.max(...values);
        const binCount = Math.min(10, Math.max(1, Math.ceil(Math.sqrt(values.length))));
        const binSize = (max - min) / binCount || 1;

        const bins = Array(binCount).fill(0);
        const labels = Array(binCount).fill('');

        values.forEach(val => {
            let index = Math.floor((val - min) / binSize);
            if (index >= binCount) index = binCount - 1;
            bins[index]++;
        });

        for (let i = 0; i < binCount; i++) {
            const start = (min + i * binSize).toFixed(0);
            const end = (min + (i + 1) * binSize).toFixed(0);
            labels[i] = `${start} - ${end}`;
        }

        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'CO2 Emissions Distribution (Frequency)',
                    data: bins,
                    backgroundColor: 'rgba(255, 159, 64, 0.6)',
                    borderColor: 'rgb(255, 159, 64)',
                    borderWidth: 1,
                    barPercentage: 1,
                    categoryPercentage: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: 'CO2 Mass Range (tons)' } },
                    y: { beginAtZero: true, title: { display: true, text: 'Record Count' } }
                }
            }
        });
    }

    // 4. Box Plot (Distributions across key metrics)
    function renderBoxPlot(records) {
        const ctx = document.getElementById('datasetChart').getContext('2d');
        const co2Values = records.map(r => Number(r.co2_mass)).filter(v => !isNaN(v));
        const loadValues = records.map(r => Number(r.gross_load)).filter(v => !isNaN(v));

        myChart = new Chart(ctx, {
            type: 'boxplot',
            data: {
                labels: ['CO2 Mass (tons)', 'Gross Load (MWh)'],
                datasets: [{
                    label: 'Metric Distribution',
                    backgroundColor: 'rgba(153, 102, 255, 0.5)',
                    borderColor: 'rgb(153, 102, 255)',
                    borderWidth: 1,
                    outlierColor: '#999999',
                    padding: 10,
                    itemRadius: 2,
                    data: [co2Values, loadValues]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    }

    // 5. Scatter Plot (Gross Load vs CO2 Emissions)
    function renderScatterPlot(records) {
        const ctx = document.getElementById('datasetChart').getContext('2d');
        const scatterData = records
            .map(r => ({
                x: Number(r.gross_load),
                y: Number(r.co2_mass)
            }))
            .filter(pt => !isNaN(pt.x) && !isNaN(pt.y));

        myChart = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [{
                    label: 'Gross Load vs CO2 Emissions',
                    data: scatterData,
                    backgroundColor: 'rgba(75, 192, 192, 0.6)',
                    borderColor: 'rgb(75, 192, 192)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: 'Gross Load (MWh)' } },
                    y: { title: { display: true, text: 'CO2 Emissions (tons)' } }
                }
            }
        });
    }

    // Pearson Correlation Helper for Heat Map
    function calculatePearsonCorrelation(xArr, yArr) {
        const n = xArr.length;
        if (n === 0) return 0;

        const meanX = xArr.reduce((a, b) => a + b, 0) / n;
        const meanY = yArr.reduce((a, b) => a + b, 0) / n;

        let num = 0, denX = 0, denY = 0;
        for (let i = 0; i < n; i++) {
            const dx = xArr[i] - meanX;
            const dy = yArr[i] - meanY;
            num += dx * dy;
            denX += dx * dx;
            denY += dy * dy;
        }

        const denominator = Math.sqrt(denX * denY);
        return denominator === 0 ? 0 : num / denominator;
    }

    // 6. Correlation Heat Map
    function renderHeatMap(records) {
        const ctx = document.getElementById('datasetChart').getContext('2d');
        const candidateFields = ['co2_mass', 'gross_load', 'heat_input', 'so2_mass', 'nox_mass'];
        const activeFields = candidateFields.filter(field => 
            records.some(r => r[field] !== undefined && !isNaN(Number(r[field])))
        );

        const matrixData = [];

        for (let i = 0; i < activeFields.length; i++) {
            for (let j = 0; j < activeFields.length; j++) {
                const fieldX = activeFields[i];
                const fieldY = activeFields[j];

                const validPairs = records
                    .map(r => [Number(r[fieldX]), Number(r[fieldY])])
                    .filter(([x, y]) => !isNaN(x) && !isNaN(y));

                const xVals = validPairs.map(p => p[0]);
                const yVals = validPairs.map(p => p[1]);
                const corr = i === j ? 1 : calculatePearsonCorrelation(xVals, yVals);

                matrixData.push({
                    x: fieldX,
                    y: fieldY,
                    v: corr
                });
            }
        }

        myChart = new Chart(ctx, {
            type: 'matrix',
            data: {
                datasets: [{
                    label: 'Pearson Correlation Matrix',
                    data: matrixData,
                    backgroundColor(context) {
                        const raw = context.dataset.data[context.dataIndex];
                        if (!raw) return 'rgba(0,0,0,0.1)';
                        const alpha = Math.max(0.15, Math.abs(raw.v));
                        return raw.v >= 0 
                            ? `rgba(54, 162, 235, ${alpha})` 
                            : `rgba(255, 99, 132, ${alpha})`;
                    },
                    borderColor: 'rgba(255, 255, 255, 0.8)',
                    borderWidth: 1,
                    width: ({ chart }) => (chart.chartArea || {}).width / activeFields.length - 2,
                    height: ({ chart }) => (chart.chartArea || {}).height / activeFields.length - 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            title: () => '',
                            label: (ctx) => `${ctx.raw.x} vs ${ctx.raw.y}: r = ${ctx.raw.v.toFixed(3)}`
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'category',
                        labels: activeFields,
                        ticks: { display: true },
                        grid: { display: false }
                    },
                    y: {
                        type: 'category',
                        labels: activeFields,
                        offset: true,
                        ticks: { display: true },
                        grid: { display: false }
                    }
                }
            }
        });
    }
    </script>

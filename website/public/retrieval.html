                        <option value="ME">Maine</option>

                    <!-- database id filter -->
                    <label for="db_id">Database ID:</label>
                    <select id="db_id" name="db_id">
                        <option>Select a database ID</option>
                    </select>

                    <!-- fetch the database IDs from the database -->
                     <!-- ChatGPT used to create this script, which
                      we will reference for future scripts that use node.js to call from the DB -->
                     <script>
                        fetch('/api/database-ids')
                            .then(response => response.json())
                            .then(database => {
                                const select = document.getElementByID('db_id');
                                databases.forEach(database => {
                                    const option = document.createElement('option');

                                    option.value = database.id;
                                    option.textContent = database.id;

                                    select.appendChild(option);
                                });
                            });
                     </script>

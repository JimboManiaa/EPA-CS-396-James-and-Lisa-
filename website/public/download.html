<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Styles ALL content -->
    <div class="content">

    <div class="title_container">
        <!-- Logo -->
        <img src="logo.png" id="logo">

        <!-- Title -->
        <h1 id="site_title">CAMPD Data Manager</h1>
    </div>    

    <!-- The nav bar ------------------------------------------------------>
    <table class="nav_bar">
        <td class="home_cell"><a href="index.html"><img src="home.png" id="nav_home"></a></td>
        <td class="nav_cell"><a href="retrieval.html">Data Retrieval</a></td>
        <td class="nav_cell"><a href="explore.html">Explore Data</a></td>
        <td class="nav_cell"><a href="upload.html">Upload Data</a></td>
        <td class="nav_cell"><a href="download.html">Download Data</a></td>
        <td class="nav_cell"><a href="facility.html">Facility</a></td>
    </table>

    <h2>Download Data</h2>
    <hr>

    <div class="info_content">
        <p>Would you like to download <u>ALL</u> onsite data?</p>

        <!-- Download buttons -->
        <button type="button" id="downloadCsv">Download as .csv file</button>
        <button type="button" id="downloadXlsx">Download as .xlsx file</button>

    </div>
    <hr>

    <!-- Script to get the files ======================================-->
    <script>
        document.getElementById("downloadCsv").addEventListener("click", async () => {
            window.location.href="/download/csv";
        });

        document.getElementById("downloadXlsx").addEventListener("click", async () => {
            window.location.href="/download/xlsx";
        });

    </script>


    <!-- Download a specific table-->
    <div class="container my-5">
    <h2>Download Database Tables</h2>

    <p>Select a table below to download its contents as a .csv or .xlsx file</p>
    

    <!-- Search Bar -->
        <!-- Search Bar -->
        <form role="search" action="/search" method="get">
            <input type="search" id="site-search" name="q" placeholder="Type here to search..." required>
        </form>

    <!-- Datasets Section -->

    <div class="db_holder">
        <table class="db_table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Facility</th>
                    <th>Date Installed</th>
                    <th>Status</th>
                </tr>
            </thead>

                <tbody id="tableBody">
                    <!-- JavaScript will put the rows here -->

                </tbody>

            </table>
    </div>

    </div>

<script>

    // Temporary data for designing the website.
    // Later, this will come from MySQL.
    async function loadDatabaseTable() {
        const tableBody = document.getElementById("tableBody");
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center">Loading live data from MySQL...</td></tr>`;

        try {
            const response = await fetch('/api/datasets');
            if (!response.ok) throw new Error('Failed to fetch data from server');
            
            const liveData = await response.json();
            
            tableBody.innerHTML = ""; // Clear loading message

            if (liveData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="text-center">No datasets installed yet.</td></tr>`;
                return;
            }

            liveData.forEach(entry => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${entry.id}</td>
                    <td>${entry.name}</td>
                    <td>${entry.facility}</td>
                    <td>${entry.date}</td>
                    <td><span class="badge bg-success">${entry.status}</span></td>
                `;
                tableBody.appendChild(row);
            });

        } catch (error) {
            console.error("Error loading table data:", error);
            tableBody.innerHTML = `<tr><td colspan="5" class="text-danger text-center">Error connecting to database backend.</td></tr>`;
        }
    }

    // Load live data on page load
    loadDatabaseTable();


    function displayTable(data) {

        const tableBody = document.getElementById("tableBody");

        tableBody.innerHTML = "";

        data.forEach(entry => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${entry.id}</td>
                <td>${entry.name}</td>
                <td>${entry.facility}</td>
                <td>${entry.date}</td>
                <td>${entry.status}</td>
            `;

            tableBody.appendChild(row);
        });
    }


</script>
</div>

</body>
</html>

<script>

    // Use JavaScript to retrieve the table data and support live searching
    async function loadDatabaseTable() {
        const tableHead = document.getElementById("tableHead");
        const tableBody = document.getElementById("tableBody");
        const searchInput = document.getElementById("site-search");

        tableBody.innerHTML = `<tr><td colspan="5" class="text-center">Loading live data from MySQL...</td></tr>`;

        try {
            const response = await fetch('/api/retrieval-data');
            
            if (!response.ok) throw new Error('Failed to fetch data from server');
            
            const liveData = await response.json();
            
            tableBody.innerHTML = ""; // Clear loading message

            // No data found
            if (liveData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="text-center">No datasets installed yet.</td></tr>`;
                return;
            }

            // get column names from the first database row
            const columns = Object.keys(liveData[0]);

            // CREATE THE TABLE HEADERS ======================
            tableHead.innerHTML = ""; // clear head if reloading
            const headerRow = document.createElement("tr");
            columns.forEach(column => {
                const th = document.createElement("th");
                th.textContent = formatColumnName(column);
                headerRow.appendChild(th);
            });
            tableHead.appendChild(headerRow);

            // FUNCTION TO RENDER ROWS ======================
            function renderRows(dataToRender) {
                tableBody.innerHTML = "";
                if (dataToRender.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="${columns.length}" class="text-center">No matching records found.</td></tr>`;
                    return;
                }
                dataToRender.forEach(entry => {
                    const row = document.createElement("tr");
                    columns.forEach(column => {
                        const cell = document.createElement("td");
                        cell.textContent = entry[column] !== null ? entry[column] : "";
                        row.appendChild(cell);
                    });
                    tableBody.appendChild(row);
                });
            }

            // Initial render of all items
            renderRows(liveData);

            // Enable searching/filtering through the rows instantly as you type
            searchInput.addEventListener("input", (e) => {
                const query = e.target.value.toLowerCase();
                const filteredData = liveData.filter(entry => {
                    return Object.values(entry).some(val => 
                        val !== null && String(val).toLowerCase().includes(query)
                    );
                });
                renderRows(filteredData);
            });

        } catch (error) {
            console.error("Error loading table data:", error);
            tableBody.innerHTML = `<tr><td colspan="5" class="text-danger text-center">Error connecting to database backend.</td></tr>`;
        }
    }

// Convert database column names into readable headers
function formatColumnName(column) {
    return column
        .replace(/_/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());
}

// Load table when page loads
loadDatabaseTable();

</script>

<script>
    fetch('/api/database-ids')
